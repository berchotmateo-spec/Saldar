<!doctype html><html lang="es"><head><meta charset="utf-8">
<!-- Fuente de og.jpg (1200 × 630, la imagen que muestra WhatsApp al compartir el link). Para rehacerla: abrir esto en Chromium a 1200 × 630 y sacar captura en JPG. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Condensed:wght@800&family=IBM+Plex+Mono:wght@600&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#F5F7FC;font-family:Barlow,sans-serif;color:#0C1018;position:relative}
.marco{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:84px}
.logo{height:92px;width:auto}
.eyebrow{margin-top:24px;font:600 22px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#0756DB}
h1{margin-top:30px;font:800 92px/1.02 'Barlow Condensed',sans-serif;text-transform:uppercase;text-align:center;letter-spacing:-.005em}
h1 .l1{white-space:nowrap}
h1 .resalte{display:inline-block;margin-top:14px;padding:0 .14em .02em;background:#0756DB;color:#fff;transform:rotate(-1.2deg);box-shadow:6px 6px 0 #0C1018}
.cinta{position:absolute;left:-20px;right:-20px;bottom:30px;height:58px;background:#0756DB;transform:rotate(-1deg);display:flex;align-items:center;justify-content:center;gap:28px;color:#fff;font:600 22px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;border-top:2px solid #0C1018;border-bottom:2px solid #0C1018}
.cinta i{font-style:normal;opacity:.7}
</style></head><body>
<div class="marco">
  <img class="logo" src="img/saldar-logo.webp" alt="">
  <p class="eyebrow">Desde 2015 · cargas en camión</p>
  <h1><span class="l1">Buenos Aires – Mar del Plata,</span><br><span class="resalte">ida y vuelta.</span></h1>
</div>
<div class="cinta"><span>Cotizá online</span><i>·</i><span>Pedilo por WhatsApp</span><i>·</i><span>saldarlogistica.com.ar</span></div>
</body></html>
